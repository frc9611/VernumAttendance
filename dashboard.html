<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VernumAttendance - Presença</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/config.js"></script>
    <script src="js/vernum.js"></script>
    <script src="js/dashboard.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="display-6 fw-bold cy-white mb-0">VernumAttendance</h1>
            <button id="logout-btn" class="btn btn-outline-light">Sair</button>
        </div>

        <div id="error-banner" class="alert alert-danger d-none"></div>

        <!-- A sala: um botão só, que vale para todas as equipes da pessoa -->
        <div class="card shadow-lg border-0 mb-4">
            <div class="card-body p-4 text-center">
                <h2 class="h3 fw-bold text-dark" id="welcome-msg">Carregando...</h2>
                <p class="text-muted mb-1"><span id="isInRoom">Carregando...</span></p>
                <p class="text-muted"><span id="elapsed"></span></p>
                <button id="room-btn" class="btn btn-lg px-5 disabled">Carregando...</button>
                <!-- One room, one total: the per-team figures were the same number repeated -->
                <p class="text-muted mt-3 mb-0"><span id="total-room"></span></p>
            </div>
        </div>

        <!-- Uma equipe por card: a marcação conta para todas de uma vez -->
        <h4 class="cy-white text-start mb-3">Suas equipes <small class="opacity-75">— escolha de quem ver o ranking</small></h4>
        <div class="row g-3 mb-4" id="teams"></div>

        <div class="row g-3">
            <div class="col-12 col-lg-5">
                <div class="card shadow-lg border-0 h-100">
                    <div class="card-body p-4">
                        <h4 class="mb-3">Na sala agora
                            <small class="text-muted">· todas as equipes</small></h4>
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light"><tr><th>Nome</th><th>Entrou</th></tr></thead>
                                <tbody id="in-room-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-12 col-lg-7">
                <div class="card shadow-lg border-0 h-100">
                    <div class="card-body p-4">
                        <h4 class="mb-3">Ranking <small class="text-muted" id="panel-team"></small></h4>
                        <div class="ranking-table-container table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light sticky-top">
                                    <tr><th scope="col">#</th><th scope="col">Nome</th><th scope="col">Tempo</th></tr>
                                </thead>
                                <tbody id="ranking-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
