<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VernumAttendance - Entrar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/index.css">
    <script src="js/config.js"></script>
    <script src="js/vernum.js"></script>
    <script src="js/index.js"></script>
</head>
<body class="bg-light">
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <h1 class="mb-4 display-4 fw-bold cy-white">VernumAttendance</h1>

        <div class="card shadow-lg border-0" style="width: 100%; max-width: 460px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <h2 class="h3 fw-bold text-dark">Registro de presença</h2>
                    <p class="text-muted">Entre com a sua conta Vernum para marcar o ponto.</p>
                </div>

                <!-- Já tem sessão nesta máquina -->
                <div id="already-logged" class="d-none text-center mb-4">
                    <p class="mb-2">Sessão de <strong id="already-name"></strong> aberta aqui.</p>
                    <button id="continue-btn" class="btn btn-primary w-100 py-2 fw-bold mb-2">Continuar</button>
                    <button id="forget-btn" class="btn btn-outline-secondary w-100 py-2">Trocar de usuário</button>
                    <hr>
                </div>

                <!-- Caminho principal: o login acontece no VernumCloud -->
                <button id="vernum-login-btn" class="btn btn-primary w-100 py-3 fw-bold shadow-sm vernum-btn">
                    Login com VernumCloud
                </button>
                <p class="text-muted small text-center mt-2 mb-4">
                    A senha é digitada no VernumCloud. O quiosque não vê a sua senha em momento nenhum.
                </p>

                <!-- Caminho alternativo: digitar aqui mesmo -->
                <details class="mb-2">
                    <summary class="text-muted small">Entrar digitando usuário e senha</summary>
                    <div class="mt-3">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="user">Usuário</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="user"
                                   autocomplete="username" placeholder="Digite seu usuário">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="password">Senha</label>
                            <input type="password" class="form-control form-control-lg bg-light" id="password"
                                   autocomplete="current-password" placeholder="Digite sua senha">
                        </div>
                        <button id="login-btn" class="btn btn-outline-primary w-100 py-2 fw-bold">ENTRAR</button>
                    </div>
                </details>

                <div class="mt-3 text-center" style="min-height: 24px;">
                    <span id="login-status" class="text-danger fw-bold"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
